name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: ARCHS=arm64 scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Nod.app
          path: build/Nod.app
